name: HOOP CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Report dependency advisories
        run: |
          npm audit --json > /tmp/hoop-npm-audit.json || true
          node - <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync("/tmp/hoop-npm-audit.json", "utf8"));
          console.log("Dependency vulnerability totals:", JSON.stringify(report.metadata?.vulnerabilities ?? {}));
          for (const [name, advisory] of Object.entries(report.vulnerabilities ?? {})) {
            console.log(JSON.stringify({
              package: name,
              severity: advisory.severity,
              direct: advisory.isDirect,
              affectedRange: advisory.range,
              fixAvailable: advisory.fixAvailable
            }));
          }
          NODE

      - name: Run ESLint
        run: npm run lint
      - name: Build and type-check
        run: npm run build
